# Builds the ZeroDoori Android app (APK) for free on GitHub's servers and publishes it as a
# GitHub Release. The newest APK is always at:
#   https://github.com/Niyutkumar/zerodoori/releases/latest/download/ZeroDoori.apk
name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        working-directory: mobile
        run: npm ci

      - name: Copy app settings into the Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk ZeroDoori.apk

      - name: Keep a copy with this run
        uses: actions/upload-artifact@v4
        with:
          name: ZeroDoori-apk
          path: ZeroDoori.apk

      - name: Publish as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${{ github.run_number }}"
          gh release create "$TAG" ZeroDoori.apk \
            --title "ZeroDoori Android app (build ${{ github.run_number }})" \
            --notes "Download **ZeroDoori.apk** below on your Android phone and open it to install. If Android asks, allow installing apps from this source. If an older ZeroDoori is installed and the update fails, uninstall the old one first." \
            --latest
