<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZeroDoori</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14121a; color: #f2eff7;
      font-family: -apple-system, Roboto, "Noto Sans", sans-serif; }
    body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
    .card { max-width: 360px; text-align: center; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #a39db0; line-height: 1.5; margin: 0 0 20px; }
    button { border: 0; border-radius: 10px; padding: 12px 22px; font-size: 16px; font-weight: 700;
      background: linear-gradient(135deg, #ff7a45, #ffb03a); color: #1a0f08; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Can't reach ZeroDoori</h1>
    <p>Check your internet connection. If nobody has used ZeroDoori for a while, the server may still be waking up – give it up to a minute.</p>
    <button onclick="window.location.replace('https://zerodoori.onrender.com/')">Try again</button>
  </div>
</body>
</html>
